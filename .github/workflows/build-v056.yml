name: Build Plutao v0.5.6 Candidate

on:
  push:
    branches:
      - release-v0.5.6
    paths:
      - "src/**"
      - ".github/scripts/update_v056.py"
      - ".github/workflows/build-v056.yml"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 v0.5.6
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: release-v0.5.6

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Aplicar migracao v0.5.6
        shell: pwsh
        run: |
          $project = Get-Content .\src\Plutao\Plutao.csproj -Raw
          if ($project -match '<Version>0\.5\.5</Version>') {
            Rename-Item .git .git-plutao
            try {
              python .\.github\scripts\update_v056.py . --no-build
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            finally {
              Rename-Item .git-plutao .git
            }
          }
          elseif ($project -notmatch '<Version>0\.5\.6</Version>') {
            Write-Error "Versao inesperada no Plutao.csproj."
            exit 1
          }

      - name: Compilar Plutao v0.5.6
        shell: pwsh
        run: |
          dotnet publish .\src\Plutao\Plutao.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish

          if (!(Test-Path .\publish\Plutao.exe)) {
            Write-Error "Plutao.exe nao foi gerado."
            exit 1
          }

      - name: Finalizar fonte v0.5.6
        shell: pwsh
        run: |
          if (Test-Path .\src\Plutao\CollectionPickerForm.cs) {
            Remove-Item .\src\Plutao\CollectionPickerForm.cs -Force
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md CHANGELOG.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Plutao v0.5.6 - estabilidade, cache e interface"
            git push origin HEAD:release-v0.5.6
          }

      - name: Criar ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\publish\Plutao.exe `
            -DestinationPath .\Plutao-v0.5.6-win-x64.zip `
            -Force

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Plutao-v0.5.6-win-x64
          path: |
            publish/Plutao.exe
            Plutao-v0.5.6-win-x64.zip
          if-no-files-found: error
