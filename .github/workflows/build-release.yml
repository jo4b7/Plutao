name: Build Plutao Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar Plutao
        shell: pwsh
        run: |
          dotnet publish .\src\Plutao\Plutao.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish

      - name: Criar ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\publish\Plutao.exe `
            -DestinationPath .\Plutao-win-x64.zip `
            -Force

      - name: Guardar artefato da compilação
        uses: actions/upload-artifact@v4
        with:
          name: Plutao-win-x64
          path: |
            publish/Plutao.exe
            Plutao-win-x64.zip
          if-no-files-found: error

      - name: Atualizar release "latest"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f latest
          git push origin refs/tags/latest --force

          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest `
              --title "Plutao - versão mais recente" `
              --notes "Compilação automática da branch main."
          }

          gh release upload latest `
            .\publish\Plutao.exe `
            .\Plutao-win-x64.zip `
            --clobber
