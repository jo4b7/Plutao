name: Validate Plutao v0.5.11

on:
  push:
    branches:
      - release-v0.5.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows x64 validation
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build estrito
        shell: pwsh
        run: |
          dotnet build .\src\Plutao\Plutao.csproj -c Release /p:TreatWarningsAsErrors=true

      - name: Publicar EXE
        shell: pwsh
        run: |
          dotnet publish .\src\Plutao\Plutao.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:TreatWarningsAsErrors=true `
            -o .\publish

          if (!(Test-Path .\publish\Plutao.exe)) {
            Write-Error "Plutao.exe nao foi gerado."
            exit 1
          }

      - name: Smoke test do EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\publish\Plutao.exe -PassThru
          Start-Sleep -Seconds 5

          if ($p.HasExited) {
            Write-Error "Plutao.exe encerrou sozinho no smoke test. ExitCode=$($p.ExitCode)"
            exit 1
          }

          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test aprovado."

      - name: Criar ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\publish\Plutao.exe `
            -DestinationPath .\Plutao-v0.5.11-win-x64.zip `
            -Force

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Plutao-v0.5.11-win-x64
          path: |
            publish/Plutao.exe
            Plutao-v0.5.11-win-x64.zip
          if-no-files-found: error
