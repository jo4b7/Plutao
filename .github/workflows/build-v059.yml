name: Build Plutao v0.5.9 Candidate

on:
  push:
    branches:
      - release-v0.5.9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 v0.5.9
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar Plutao
        shell: pwsh
        run: |
          dotnet publish .\src\Plutao\Plutao.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish

          if (!(Test-Path .\publish\Plutao.exe)) {
            Write-Error "Plutao.exe nao foi gerado."
            exit 1
          }

      - name: Teste de inicializacao do EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\publish\Plutao.exe -PassThru
          Start-Sleep -Seconds 4
          if ($process.HasExited) {
            throw "Plutao.exe encerrou durante o teste de inicializacao. ExitCode=$($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()
          Write-Host "Smoke test OK: o aplicativo permaneceu aberto."

      - name: Teste real de canais YouTube
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\integration-v059 | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\src\Plutao\Plutao.csproj" />
            </ItemGroup>
          </Project>
          '@ | Set-Content .\integration-v059\Integration.csproj -Encoding UTF8

          @'
          using System.Drawing;
          using Plutao;

          static async Task<bool> HasDecodableThumbnailAsync(CollectionMediaItem item)
          {
              var candidates = new List<string>();
              if (!string.IsNullOrWhiteSpace(item.ThumbnailUrl))
                  candidates.Add(item.ThumbnailUrl);

              if (!string.IsNullOrWhiteSpace(item.Id))
              {
                  foreach (var suffix in new[] { "hqdefault.jpg", "mqdefault.jpg", "sddefault.jpg", "maxresdefault.jpg", "0.jpg" })
                      candidates.Add($"https://i.ytimg.com/vi/{item.Id}/{suffix}");
              }

              using var http = new HttpClient { Timeout = TimeSpan.FromSeconds(12) };
              http.DefaultRequestHeaders.TryAddWithoutValidation("User-Agent", "Mozilla/5.0");

              foreach (var url in candidates.Distinct(StringComparer.OrdinalIgnoreCase))
              {
                  try
                  {
                      var bytes = await http.GetByteArrayAsync(url);
                      using var ms = new MemoryStream(bytes);
                      using var image = Image.FromStream(ms, useEmbeddedColorManagement: false, validateImageData: true);
                      if (image.Width > 0 && image.Height > 0)
                          return true;
                  }
                  catch { }
              }

              return false;
          }

          var tools = new ToolManager();
          var runner = new YtDlpRunner(tools);
          var log = new Progress<string>(Console.WriteLine);
          var progress = new Progress<DownloadProgressInfo>(_ => { });

          var noTabsChannel = await runner.AnalyzeCollectionAsync(
              "https://www.youtube.com/channel/UCBJnlO1GN9pM1xFduO56oyQ",
              "Nenhum",
              50,
              log,
              progress,
              CancellationToken.None);

          if (noTabsChannel.Count == 0)
              throw new Exception("Canal sem Shorts/Lives não retornou os vídeos normais.");

          var shorts = await runner.AnalyzeCollectionAsync(
              "https://www.youtube.com/@DONOSDAM%C3%8DDIA/shorts",
              "Nenhum",
              10,
              log,
              progress,
              CancellationToken.None);

          if (shorts.Count == 0)
              throw new Exception("A aba Shorts do canal de teste veio vazia.");

          if (shorts.Any(x => !string.Equals(x.Category, "Shorts", StringComparison.OrdinalIgnoreCase)))
              throw new Exception("A categoria Shorts não foi preservada.");

          var thumbnailOk = false;
          foreach (var item in shorts.Take(3))
          {
              if (await HasDecodableThumbnailAsync(item))
              {
                  thumbnailOk = true;
                  break;
              }
          }

          if (!thumbnailOk)
              throw new Exception("Nenhum fallback de miniatura dos Shorts pôde ser decodificado.");

          Console.WriteLine($"Integração OK: canal={noTabsChannel.Count}, shorts={shorts.Count}, thumbnail=OK");
          '@ | Set-Content .\integration-v059\Program.cs -Encoding UTF8

          dotnet run --project .\integration-v059\Integration.csproj -c Release

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Plutao-v0.5.9-candidate
          path: publish/Plutao.exe
          if-no-files-found: error
