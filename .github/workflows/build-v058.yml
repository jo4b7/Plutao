name: Build Plutao v0.5.8 Candidate

on:
  push:
    branches:
      - release-v0.5.8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 v0.5.8
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar Plutao v0.5.8
        shell: pwsh
        run: |
          dotnet publish .\src\Plutao\Plutao.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish

          if (!(Test-Path .\publish\Plutao.exe)) {
            Write-Error "Plutao.exe nao foi gerado."
            exit 1
          }

      - name: Criar ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\publish\Plutao.exe `
            -DestinationPath .\Plutao-v0.5.8-win-x64.zip `
            -Force

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Plutao-v0.5.8-win-x64
          path: |
            publish/Plutao.exe
            Plutao-v0.5.8-win-x64.zip
          if-no-files-found: error
